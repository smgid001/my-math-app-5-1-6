<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>사각형의 둘레를 구해 볼까요</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;700;900&display=swap');
        body {
            font-family: 'Noto Sans KR', sans-serif;
            background-color: #f4faf0;
        }

        .sky-bg {
            background: linear-gradient(180deg, #bae6fd 0%, #e0f2fe 100%);
        }

        .post-shadow {
            filter: drop-shadow(0px 4px 2px rgba(0, 0, 0, 0.15));
        }

        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-6px); }
        }
        .character-bounce {
            animation: bounce 2s infinite ease-in-out;
        }

        @keyframes sway {
            0%, 100% { transform: rotate(0deg); }
            50% { transform: rotate(3deg); }
        }
        .flower-sway {
            animation: sway 3s infinite ease-in-out;
            transform-origin: bottom center;
        }
    </style>
</head>

<body class="min-h-screen flex flex-col items-center justify-center p-3 md:p-5 select-none text-base md:text-lg">
<!-- 메인 컨테이너 (16:10 고정 비율) -->
<div class="w-full max-w-5xl bg-white rounded-3xl shadow-2xl border-4 border-[#82ca5e] overflow-hidden flex flex-col" style="aspect-ratio: 16 / 10;">

    <!-- 상단 헤더 -->
    <div class="bg-[#82ca5e] px-6 py-3 text-white flex justify-between items-center shrink-0">
        <div>
            <span class="bg-[#5ea739] text-xs font-bold px-3 py-1 rounded-full uppercase tracking-wider">초등 5학년 1학기</span>
            <h1 class="text-xl md:text-2xl font-extrabold mt-1 flex items-center gap-2">
                <span>⛺</span> 사각형의 둘레를 구해 볼까요
            </h1>
        </div>
    </div>

    <!-- 메인 작업 공간 -->
    <div class="flex-1 grid grid-cols-12 gap-4 p-4 min-h-0 overflow-hidden">

        <!-- 왼쪽: 시뮬레이션, 네 변 더해보기, 공식 도출 -->
        <div class="col-span-6 flex flex-col gap-2.5 h-full min-h-0">

            <!-- 시뮬레이션 박스 -->
            <div class="flex-1 min-h-0 w-full rounded-2xl overflow-hidden shadow-inner border-2 border-slate-200 sky-bg relative">

                <!-- 배경 장식 -->
                <div class="absolute inset-0 pointer-events-none">
                    <div class="absolute top-6 left-10 w-16 h-8 bg-white opacity-80 rounded-full filter blur-[1px]"></div>
                    <div class="absolute top-12 right-16 w-24 h-10 bg-white opacity-80 rounded-full filter blur-[1px]"></div>
                    <div class="absolute bottom-0 w-full h-[45%] bg-[#b0e89d]"></div>
                    <div class="absolute bottom-4 right-6 flex gap-2 text-2xl opacity-90 flower-sway">
                        <span>🌸</span><span>🌼</span><span>🌷</span>
                    </div>
                </div>

                <!-- SVG 사각형 정원 시뮬레이션 -->
                <div class="absolute inset-0 z-20 flex items-center justify-center">
                    <svg id="simulation-svg" class="w-full h-full" viewBox="0 0 500 280">
                        <defs>
                            <pattern id="flower-pattern" width="30" height="30" patternUnits="userSpaceOnUse">
                                <rect width="30" height="30" fill="#86efac"/>
                                <circle cx="15" cy="15" r="2" fill="#22c55e"/>
                                <circle cx="8" cy="8" r="3" fill="#f43f5e"/>
                                <circle cx="22" cy="22" r="3" fill="#fbbf24"/>
                            </pattern>
                        </defs>
                        <polygon id="garden-polygon" points="" fill="url(#flower-pattern)" stroke="#15803d" stroke-width="2" stroke-dasharray="4,4" />
                        <g id="ropes-group"></g>
                        <g id="posts-group"></g>
                        <g id="texts-group"></g>
                    </svg>
                </div>

                <!-- 캐릭터 + 말풍선 -->
                <div class="absolute bottom-2 left-3 z-30 flex items-end gap-2">
                    <div class="w-9 h-9 bg-amber-100 rounded-full border-2 border-amber-400 flex items-center justify-center text-lg shadow-md shrink-0 character-bounce">
                        🧑‍🌾
                    </div>
                    <div class="bg-white/95 px-3 py-1.5 rounded-2xl shadow-lg border-2 border-[#82ca5e] text-xs md:text-sm font-bold text-slate-800 max-w-[240px]">
                        <span id="char-speech">사각형 정원에 예쁜 울타리를 둘러볼까요?</span>
                    </div>
                </div>

                <!-- 색상 범례 -->
                <div id="color-legend" class="absolute top-3 right-3 z-30 bg-white/90 px-3 py-1 rounded-xl border border-slate-200 text-xs font-bold shadow-sm">
                    <span class="text-blue-600">■ 가로</span> <span class="text-red-500 ml-1.5">■ 세로</span>
                </div>
            </div>

            <!-- 네 변의 길이를 모두 더하는 과정 시각화 -->
            <div class="bg-slate-50 border-2 border-dashed border-slate-200 rounded-2xl px-3 py-2 flex flex-col justify-center items-center min-h-[75px] shrink-0">
                <p class="text-xs text-slate-500 font-bold mb-1 uppercase tracking-wider">정원 울타리에 두른 밧줄의 길이는?</p>
                <div id="formula-display" class="text-sm md:text-base font-extrabold flex flex-wrap items-center justify-center gap-1.5">
                    <span class="text-slate-400 font-normal text-sm">‘울타리에 줄 두르기’ 버튼을 눌러보세요!</span>
                </div>
            </div>

            <!-- 사각형 둘레 구하는 방법 정리하기 -->
            <div class="bg-white border-2 border-[#82ca5e] rounded-2xl px-3 py-2.5 flex flex-col gap-1.5 shadow-sm shrink-0">
                <p class="text-sm text-[#4c8a2b] font-bold uppercase tracking-wider flex items-center gap-1">
                    <span>💡</span> <span id="summary-title">직사각형의 둘레를 구하는 방법을 정리해봅시다.</span>
                </p>
                
                <div id="formula-inputs-box" class="flex flex-col items-start gap-2 text-sm font-extrabold text-slate-700 bg-[#f7fdf5] p-3 rounded-xl border border-[#c2e7b0]">
                    <!-- JS로 동적 생성 -->
                </div>
            </div>

        </div>

        <!-- 오른쪽: 설정 및 미션 -->
        <div class="col-span-6 flex flex-col gap-2.5 h-full min-h-0">

            <!-- 설계하기 설정 구역 -->
            <div class="bg-[#f0f9eb] border-2 border-[#c2e7b0] rounded-2xl p-3.5 flex flex-col gap-2 flex-1 min-h-0 justify-center">
                <h3 class="font-bold text-[#4c8a2b] flex items-center gap-1.5 border-b border-[#c2e7b0] pb-1 text-sm md:text-base shrink-0">
                    <span>⚙️</span> 캠핑장 정원 설계하기 (설정)
                </h3>

                <!-- 사각형 종류 선택 -->
                <div class="flex-1 flex flex-col justify-center min-h-0">
                    <label class="block text-sm font-bold text-slate-600 mb-1">정원 모양 선택</label>
                    <div class="grid grid-cols-3 gap-1.5">
                        <button onclick="selectShape('rect')" id="btn-rect" class="shape-btn px-2 py-1.5 rounded-xl text-sm font-bold border-2 bg-[#82ca5e] text-white border-[#82ca5e]">직사각형 정원</button>
                        <button onclick="selectShape('para')" id="btn-para" class="shape-btn px-2 py-1.5 rounded-xl text-sm font-bold border-2 bg-white text-slate-600 border-slate-200 hover:border-slate-300">평행사변형 정원</button>
                        <button onclick="selectShape('rhombus')" id="btn-rhombus" class="shape-btn px-2 py-1.5 rounded-xl text-sm font-bold border-2 bg-white text-slate-600 border-slate-200 hover:border-slate-300">마름모 정원</button>
                    </div>
                </div>

                <!-- 변의 길이 슬라이더 -->
                <div class="grid grid-cols-2 gap-2 mt-0.5">
                    <div>
                        <div class="flex justify-between text-xs font-bold text-slate-600 mb-0.5">
                            <span id="label-a">가로</span>
                            <span id="val-a-text" class="text-blue-600 font-black text-sm">8m</span>
                        </div>
                        <input type="range" id="slider-a" min="1" max="10" value="8" oninput="updateDimensions()" class="w-full h-2 bg-slate-200 rounded appearance-none cursor-pointer accent-[#82ca5e]">
                    </div>
                    <div id="slider-b-container">
                        <div class="flex justify-between text-xs font-bold text-slate-600 mb-0.5">
                            <span id="label-b">세로</span>
                            <span id="val-b-text" class="text-red-500 font-black text-sm">5m</span>
                        </div>
                        <input type="range" id="slider-b" min="1" max="10" value="5" oninput="updateDimensions()" class="w-full h-2 bg-slate-200 rounded appearance-none cursor-pointer accent-[#82ca5e]">
                    </div>
                </div>

                <!-- 울타리에 줄 두르기 버튼 -->
                <button onclick="startRopeAnimation()" id="play-btn" class="w-full bg-[#fa8c16] hover:bg-[#e07b10] text-white font-black text-sm md:text-base py-2.5 px-3 rounded-xl shadow-md transition-colors flex items-center justify-center gap-1.5 shrink-0 mt-1">
                    <span>🧵</span> 울타리에 줄 두르기
                </button>
            </div>

            <!-- 미션: 공식에 숫자를 넣어서 둘레 구하기 -->
            <div class="bg-white border-2 border-slate-100 rounded-2xl p-3.5 shadow-sm flex flex-col gap-2 flex-1 min-h-0 justify-center">
                <div class="flex justify-between items-center border-b border-slate-100 pb-1 shrink-0">
                    <h3 class="font-bold text-slate-800 flex items-center gap-1.5 text-sm md:text-base">
                        <span>📝</span> 둘레 구하기 미션
                    </h3>
                    <span class="bg-amber-100 text-amber-800 text-xs md:text-sm font-bold px-2.5 py-0.5 rounded">미션 20점</span>
                </div>

                <div class="bg-slate-50 p-2 rounded-xl shrink-0">
                    <p class="text-sm leading-relaxed text-slate-700">
                        설정한 <span id="quiz-shape-name" class="font-extrabold text-[#4c8a2b]">직사각형</span> 정원의 둘레를 구하는 식을 완성해봅시다.
                    </p>
                </div>

                <!-- 공식 카드 입력창 -->
                <div class="flex-1 flex flex-col justify-center min-h-0">
                    <div id="quiz-inputs-container" class="flex items-center gap-1.5 text-sm md:text-base font-extrabold justify-center bg-slate-50 p-2.5 rounded-xl border border-slate-200 flex-wrap">
                        <!-- JS로 동적 생성 -->
                    </div>
                </div>

                <!-- 정답 제출 버튼 -->
                <button onclick="validateQuiz()" class="w-full bg-[#1890ff] hover:bg-[#096dd9] text-white font-bold py-2.5 px-3 rounded-xl shadow-md transition-colors text-sm md:text-base flex items-center justify-center gap-1.5 shrink-0">
                    <span>🔍</span> 정답 제출 및 확인
                </button>
            </div>

            <!-- 스코어 판 -->
            <div class="flex justify-between items-center px-4 py-2 bg-slate-100 rounded-xl shrink-0 h-[40px]">
                <span class="text-slate-600 font-bold text-sm">🏅 나의 수학 탐구 점수</span>
                <span class="text-sm md:text-base font-extrabold text-[#4c8a2b]"><span id="score-val">0</span>점 / 100점</span>
            </div>

        </div>

    </div>

</div>

<!-- 컨페티 효과 모듈 -->
<div id="confetti-container" class="fixed inset-0 pointer-events-none z-50 overflow-hidden"></div>

<!-- 커스텀 모달 알림창 -->
<div id="custom-modal" class="fixed inset-0 bg-black/50 z-50 flex items-center justify-center opacity-0 pointer-events-none transition-opacity duration-300">
    <div class="bg-white rounded-3xl p-6 max-w-sm w-full mx-4 shadow-2xl border-4 border-[#82ca5e] transform scale-95 transition-transform duration-300 text-center">
        <div id="modal-icon" class="text-4xl mb-2">🎉</div>
        <h3 id="modal-title" class="text-xl font-black text-slate-800 mb-2">성공!</h3>
        <p id="modal-message" class="text-sm md:text-base text-slate-600 leading-relaxed mb-6 whitespace-pre-line"></p>
        <button onclick="closeModal()" class="w-full bg-[#82ca5e] hover:bg-[#5ea739] text-white font-black py-2.5 rounded-xl shadow-md transition-colors text-sm md:text-base">확인</button>
    </div>
</div>

<script>
    let currentShape = 'rect';
    let valA = 8;
    let valB = 5;
    let isDrawing = false;
    let isRoped = false;
    let score = 0;

    const SVG_NS = "http://www.w3.org/2000/svg";

    const shapeConfig = {
        rect: {
            name: "직사각형",
            summaryTitle: "직사각형의 둘레를 구하는 방법을 정리해봅시다.",
            f1_ph: "가로", f2_ph: "세로",
            correct1: ["가로", "세로"], correct2: ["세로", "가로"], correctNum: "2",
            legend: "<span class='text-blue-600'>■ 가로</span> <span class='text-red-500 ml-1.5'>■ 세로</span>",
            speechBefore: "직사각형 정원에 예쁜 울타리를 둘러볼까요?",
            speechAfter: "마주 보는 두 변의 길이가 같아. 같은 변의 길이가 2개씩 있어."
        },
        para: {
            name: "평행사변형",
            summaryTitle: "평행사변형의 둘레를 구하는 방법을 정리해봅시다.",
            f1_ph: "한 변의 길이", f2_ph: "이웃한 변의 길이",
            correct1: ["한변의길이", "이웃한변의길이", "한변", "이웃한변"],
            correct2: ["이웃한변의길이", "한변의길이", "이웃한변", "한변"], correctNum: "2",
            legend: "<span class='text-blue-600'>■ 한 변</span> <span class='text-emerald-600 ml-1.5'>■ 이웃한 변</span>",
            speechBefore: "평행사변형 정원에 예쁜 울타리를 둘러볼까요?",
            speechAfter: "마주 보는 두 변의 길이가 같아. 같은 변의 길이가 2개씩 있어."
        },
        rhombus: {
            name: "마름모",
            summaryTitle: "마름모의 둘레를 구하는 방법을 정리해봅시다.",
            f1_ph: "한 변의 길이",
            correct1: ["한변의길이", "한변"], correctNum: "4",
            legend: "<span class='text-purple-600'>■ 네 변의 길이 모두 같음</span>",
            speechBefore: "마름모 정원에 예쁜 울타리를 둘러볼까요?",
            speechAfter: "네 변의 길이가 모두 같아."
        }
    };

    window.onload = function() {
        selectShape('rect');
    };

    function selectShape(type) {
        if (isDrawing) return;
        currentShape = type;
        isRoped = false;

        document.querySelectorAll('.shape-btn').forEach(btn => {
            btn.className = "shape-btn px-2 py-1.5 rounded-xl text-sm font-bold border-2 bg-white text-slate-600 border-slate-200 hover:border-slate-300";
        });
        document.getElementById(`btn-${type}`).className = "shape-btn px-2 py-1.5 rounded-xl text-sm font-bold border-2 bg-[#82ca5e] text-white border-[#82ca5e]";

        const bContainer = document.getElementById('slider-b-container');
        if (type === 'rhombus') {
            bContainer.style.display = 'none';
            document.getElementById('label-a').innerText = '한 변의 길이';
            document.getElementById('label-a').className = 'text-purple-600 font-bold';
        } else {
            bContainer.style.display = 'block';
            document.getElementById('label-a').innerText = (type === 'rect') ? '가로' : '한 변의 길이';
            document.getElementById('label-a').className = 'text-blue-600 font-bold';
            document.getElementById('label-b').innerText = (type === 'rect') ? '세로' : '이웃한 변의 길이';
            document.getElementById('label-b').className = (type === 'rect') ? 'text-red-500 font-bold' : 'text-emerald-600 font-bold';
        }

        const config = shapeConfig[type];
        document.getElementById('summary-title').innerText = config.summaryTitle;
        document.getElementById('color-legend').innerHTML = config.legend;
        document.getElementById('char-speech').innerText = config.speechBefore;
        document.getElementById('quiz-shape-name').innerText = config.name;

        renderSummaryInputs();
        clearFormulaDisplay();
        renderQuizInputs();
        renderScene();
    }

    function renderSummaryInputs() {
        const box = document.getElementById('formula-inputs-box');
        const config = shapeConfig[currentShape];

        if (currentShape === 'rhombus') {
            box.innerHTML = `
                <div class="flex items-center gap-1.5 w-full pl-2">
                    <span class="text-slate-600">(${config.name} 둘레) =</span>
                </div>
                <div class="flex items-center gap-1.5 w-full flex-wrap pl-2">
                    <input type="text" id="general-input-1" class="w-32 h-9 border-2 border-slate-300 rounded-lg text-center text-sm font-bold focus:outline-none focus:ring-2 focus:ring-[#82ca5e]" placeholder="${config.f1_ph}">
                    <span class="text-amber-500 font-extrabold text-base">×</span>
                    <input type="number" id="general-input-num" min="1" max="10" oninput="if(this.value < 1) this.value = '';" class="w-14 h-9 border-2 border-amber-400 rounded-lg text-center text-sm font-black text-amber-600 focus:outline-none focus:ring-2 focus:ring-amber-500" placeholder="?">
                    <button onclick="validateGeneralFormula()" class="ml-1 bg-[#82ca5e] hover:bg-[#5ea739] text-white text-sm px-3 py-2 rounded-lg transition-colors shadow-sm flex items-center gap-1 font-bold">
                        <span>✔</span> 확인
                    </button>
                </div>
            `;
        } else {
            box.innerHTML = `
                <div class="flex items-center gap-1.5 w-full pl-2">
                    <span class="text-slate-600">(${config.name} 둘레) =</span>
                </div>
                <div class="flex items-center gap-1.5 w-full flex-wrap pl-2">
                    <span class="text-slate-600">(</span>
                    <input type="text" id="general-input-1" class="w-28 h-9 border-2 border-slate-300 rounded-lg text-center text-sm font-bold focus:outline-none focus:ring-2 focus:ring-[#82ca5e]" placeholder="${config.f1_ph}">
                    <span class="text-slate-500">+</span>
                    <input type="text" id="general-input-2" class="w-36 h-9 border-2 border-slate-300 rounded-lg text-center text-sm font-bold focus:outline-none focus:ring-2 focus:ring-[#82ca5e]" placeholder="${config.f2_ph}">
                    <span class="text-amber-500 font-extrabold text-base">) ×</span>
                    <input type="number" id="general-input-num" min="1" max="10" oninput="if(this.value < 1) this.value = '';" class="w-14 h-9 border-2 border-amber-400 rounded-lg text-center text-sm font-black text-amber-600 focus:outline-none focus:ring-2 focus:ring-amber-500" placeholder="?">
                    <button onclick="validateGeneralFormula()" class="ml-1 bg-[#82ca5e] hover:bg-[#5ea739] text-white text-sm px-3 py-2 rounded-lg transition-colors shadow-sm flex items-center gap-1 font-bold">
                        <span>✔</span> 확인
                    </button>
                </div>
            `;
        }
    }

    function updateDimensions() {
        if (isDrawing) return;
        valA = parseInt(document.getElementById('slider-a').value);
        valB = parseInt(document.getElementById('slider-b').value);

        document.getElementById('val-a-text').innerText = `${valA}m`;
        document.getElementById('val-b-text').innerText = `${valB}m`;

        clearFormulaDisplay();
        renderQuizInputs();
        renderScene();
    }

    function clearFormulaDisplay() {
        isRoped = false;
        document.getElementById('formula-display').innerHTML = '<span class="text-slate-400 font-normal text-sm">‘울타리에 줄 두르기’ 버튼을 눌러보세요!</span>';
        document.getElementById('char-speech').innerText = shapeConfig[currentShape].speechBefore;
    }

    function renderQuizInputs() {
        const container = document.getElementById('quiz-inputs-container');
        const config = shapeConfig[currentShape];

        if (currentShape === 'rhombus') {
            container.innerHTML = `
                <div class="flex flex-col items-center gap-0.5">
                    <input type="number" id="quiz-in-a" min="1" max="10" oninput="if(this.value < 1) this.value = '';" class="w-20 h-9 border-2 border-orange-400 rounded-lg text-center font-black text-sm md:text-base focus:outline-none" placeholder="?">
                    <span class="text-xs text-slate-500 font-bold">한 변의 길이</span>
                </div>
                <span class="text-amber-500 text-base font-black">×</span>
                <div class="flex flex-col items-center gap-0.5">
                    <input type="number" id="quiz-in-b" min="1" max="10" oninput="if(this.value < 1) this.value = '';" class="w-14 h-9 border-2 border-orange-400 rounded-lg text-center font-black text-sm md:text-base focus:outline-none bg-amber-50 text-amber-700" value="4" disabled>
                    <span class="text-xs text-slate-500 font-bold">변의 수</span>
                </div>
                <span class="text-slate-400 text-base">=</span>
                <div class="flex flex-col items-center gap-0.5">
                    <div class="relative">
                        <input type="number" id="quiz-in-ans" min="1" max="100" oninput="if(this.value < 1) this.value = '';" class="w-24 h-9 border-2 border-orange-400 rounded-lg text-center font-black text-sm md:text-base focus:outline-none pr-5" placeholder="?">
                        <span class="absolute right-1.5 top-2 text-xs text-slate-400 font-bold">m</span>
                    </div>
                    <span class="text-xs text-slate-500 font-bold">${config.name} 둘레</span>
                </div>
            `;
        } else {
            const labelA = (currentShape === 'rect') ? '가로' : '한 변';
            const labelB = (currentShape === 'rect') ? '세로' : '이웃한 변';
            container.innerHTML = `
                <span class="text-slate-600 font-bold text-base">(</span>
                <div class="flex flex-col items-center gap-0.5">
                    <input type="number" id="quiz-in-a" min="1" max="10" oninput="if(this.value < 1) this.value = '';" class="w-16 h-9 border-2 border-orange-400 rounded-lg text-center font-black text-sm md:text-base focus:outline-none" placeholder="?">
                    <span class="text-xs text-slate-500 font-bold">${labelA}</span>
                </div>
                <span class="text-slate-400 text-base">+</span>
                <div class="flex flex-col items-center gap-0.5">
                    <input type="number" id="quiz-in-b" min="1" max="10" oninput="if(this.value < 1) this.value = '';" class="w-16 h-9 border-2 border-orange-400 rounded-lg text-center font-black text-sm md:text-base focus:outline-none" placeholder="?">
                    <span class="text-xs text-slate-500 font-bold">${labelB}</span>
                </div>
                <span class="text-slate-600 font-bold text-base">)</span>
                <span class="text-amber-500 text-base font-black">× 2 =</span>
                <div class="flex flex-col items-center gap-0.5">
                    <div class="relative">
                        <input type="number" id="quiz-in-ans" min="1" max="100" oninput="if(this.value < 1) this.value = '';" class="w-24 h-9 border-2 border-orange-400 rounded-lg text-center font-black text-sm md:text-base focus:outline-none pr-5" placeholder="?">
                        <span class="absolute right-1.5 top-2 text-xs text-slate-400 font-bold">m</span>
                    </div>
                    <span class="text-xs text-slate-500 font-bold">${config.name} 둘레</span>
                </div>
            `;
        }
    }

    /* 시계방향 정렬 (상 -> 우 -> 하 -> 좌) */
    function getShapeVertices(type, cx, cy, valA, valB) {
        const scale = 12;
        const pts = [];

        if (type === 'rect') {
            const w = valA * scale, h = valB * scale;
            const raw = [
                {x: cx - w/2, y: cy - h/2}, // 0: 좌상
                {x: cx + w/2, y: cy - h/2}, // 1: 우상
                {x: cx + w/2, y: cy + h/2}, // 2: 우하
                {x: cx - w/2, y: cy + h/2}  // 3: 좌하
            ];
            // 시계방향 순서: 상(가로), 우(세로), 하(가로), 좌(세로)
            pts.push({ ...raw[0], next: raw[1], len: valA, col: '#2563eb', label: '가로' });
            pts.push({ ...raw[1], next: raw[2], len: valB, col: '#ef4444', label: '세로' });
            pts.push({ ...raw[2], next: raw[3], len: valA, col: '#2563eb', label: '가로' });
            pts.push({ ...raw[3], next: raw[0], len: valB, col: '#ef4444', label: '세로' });
        } else if (type === 'para') {
            const w = valA * scale, h = valB * scale, skew = 22;
            const raw = [
                {x: cx - w/2 + skew, y: cy - h/2}, // 0: 상좌
                {x: cx + w/2 + skew, y: cy - h/2}, // 1: 상우
                {x: cx + w/2 - skew, y: cy + h/2}, // 2: 하우
                {x: cx - w/2 - skew, y: cy + h/2}  // 3: 하좌
            ];
            // 시계방향 순서: 상(한 변), 우(이웃한 변), 하(한 변), 좌(이웃한 변)
            pts.push({ ...raw[0], next: raw[1], len: valA, col: '#2563eb', label: '한 변' });
            pts.push({ ...raw[1], next: raw[2], len: valB, col: '#059669', label: '이웃한 변' });
            pts.push({ ...raw[2], next: raw[3], len: valA, col: '#2563eb', label: '한 변' });
            pts.push({ ...raw[3], next: raw[0], len: valB, col: '#059669', label: '이웃한 변' });
        } else if (type === 'rhombus') {
            const side = valA * scale;
            const h = side * 0.7, w = side * 1.0;
            const raw = [
                {x: cx, y: cy - h},         // 0: 상
                {x: cx + w, y: cy},         // 1: 우
                {x: cx, y: cy + h},         // 2: 하
                {x: cx - w, y: cy}          // 3: 좌
            ];
            // 시계방향 순서: 4변 모두 한 변의 길이
            pts.push({ ...raw[0], next: raw[1], len: valA, col: '#9333ea', label: '한 변' });
            pts.push({ ...raw[1], next: raw[2], len: valA, col: '#9333ea', label: '한 변' });
            pts.push({ ...raw[2], next: raw[3], len: valA, col: '#9333ea', label: '한 변' });
            pts.push({ ...raw[3], next: raw[0], len: valA, col: '#9333ea', label: '한 변' });
        }

        return pts;
    }

    function renderScene() {
        const cx = 250, cy = 110;
        const pts = getShapeVertices(currentShape, cx, cy, valA, valB);

        const soilPoly = document.getElementById('garden-polygon');
        soilPoly.setAttribute('points', pts.map(p => `${p.x},${p.y}`).join(' '));

        const postsGroup = document.getElementById('posts-group');
        postsGroup.innerHTML = '';

        pts.forEach((p) => {
            const g = document.createElementNS(SVG_NS, "g");
            g.setAttribute('class', 'post-shadow');

            const rect = document.createElementNS(SVG_NS, "rect");
            rect.setAttribute('x', p.x - 5);
            rect.setAttribute('y', p.y - 18);
            rect.setAttribute('width', 10);
            rect.setAttribute('height', 22);
            rect.setAttribute('rx', 2.5);
            rect.setAttribute('fill', '#9c724b');
            rect.setAttribute('stroke', '#6e4c2f');

            g.appendChild(rect);
            postsGroup.appendChild(g);
        });

        document.getElementById('ropes-group').innerHTML = '';
        const textsGroup = document.getElementById('texts-group');
        textsGroup.innerHTML = '';

        for (let i = 0; i < 4; i++) {
            const p1 = pts[i];
            const p2 = p1.next;
            const midX = (p1.x + p2.x) / 2;
            const midY = (p1.y + p2.y) / 2;

            let offsetX = 0, offsetY = 0;
            if (i === 0) offsetY = -12;
            else if (i === 1) offsetX = 18;
            else if (i === 2) offsetY = 18;
            else if (i === 3) offsetX = -18;

            const text = document.createElementNS(SVG_NS, "text");
            text.setAttribute('x', midX + offsetX);
            text.setAttribute('y', midY + offsetY);
            text.setAttribute('fill', p1.col);
            text.setAttribute('font-weight', '900');
            text.setAttribute('font-size', '13px');
            text.setAttribute('text-anchor', 'middle');
            text.textContent = `${p1.len}m`;

            textsGroup.appendChild(text);
        }
    }

    function startRopeAnimation() {
        if (isDrawing) return;
        isDrawing = true;
        isRoped = true;

        const formulaDisplay = document.getElementById('formula-display');
        formulaDisplay.innerHTML = '';

        const cx = 250, cy = 110;
        const pts = getShapeVertices(currentShape, cx, cy, valA, valB);
        const ropesGroup = document.getElementById('ropes-group');
        ropesGroup.innerHTML = '';

        let currentEdge = 0;

        function drawNextRope() {
            if (currentEdge >= 4) {
                isDrawing = false;
                appendFormula();
                document.getElementById('char-speech').innerText = shapeConfig[currentShape].speechAfter;
                return;
            }

            const p1 = pts[currentEdge];
            const p2 = p1.next;

            const line = document.createElementNS(SVG_NS, "line");
            line.setAttribute('x1', p1.x);
            line.setAttribute('y1', p1.y);
            line.setAttribute('x2', p1.x);
            line.setAttribute('y2', p1.y);

            line.setAttribute('stroke', p1.col);
            line.setAttribute('stroke-width', '4.5');
            line.setAttribute('stroke-linecap', 'round');

            ropesGroup.appendChild(line);

            appendAdditionCard(currentEdge, p1);

            let startTimestamp = null;
            const duration = 500;

            function animateSegment(timestamp) {
                if (!startTimestamp) startTimestamp = timestamp;
                const progress = Math.min((timestamp - startTimestamp) / duration, 1);

                const currX = p1.x + (p2.x - p1.x) * progress;
                const currY = p1.y + (p2.y - p1.y) * progress;

                line.setAttribute('x2', currX);
                line.setAttribute('y2', currY);

                if (progress < 1) {
                    requestAnimationFrame(animateSegment);
                } else {
                    currentEdge++;
                    drawNextRope();
                }
            }

            requestAnimationFrame(animateSegment);
        }

        drawNextRope();
    }

    function appendAdditionCard(index, pt) {
        const formulaDisplay = document.getElementById('formula-display');

        if (index > 0) {
            const plusSign = document.createElement('span');
            plusSign.className = "text-slate-400 mx-0.5 text-sm";
            plusSign.innerText = "+";
            formulaDisplay.appendChild(plusSign);
        }

        const card = document.createElement('div');
        card.style.backgroundColor = pt.col;
        card.className = `text-white px-2.5 py-1 rounded-lg font-black shadow-md flex items-center gap-1 text-xs md:text-sm shrink-0`;
        card.innerHTML = `
            <span>${pt.label}: ${pt.len}m</span>
        `;

        formulaDisplay.appendChild(card);
    }

    function appendFormula() {
        const formulaDisplay = document.getElementById('formula-display');

        // 첫 번째 줄(덧셈) 아래로 줄바꿈
        const breakDiv = document.createElement('div');
        breakDiv.className = "w-full basis-full h-0";
        formulaDisplay.appendChild(breakDiv);

        // 두 번째 줄 영역 (등호 + 공식 카드)
        const bottomLine = document.createElement('div');
        bottomLine.className = "flex items-center justify-center gap-2 mt-1 w-full";

        const equalsSign = document.createElement('span');
        equalsSign.className = "text-slate-500 font-black text-base";
        equalsSign.innerText = "=";
        bottomLine.appendChild(equalsSign);

        const multCard = document.createElement('div');
        multCard.className = "flex items-center gap-1.5 bg-amber-500 text-white px-3 py-1.5 rounded-xl font-black shadow-md border-2 border-amber-300 text-sm md:text-base shrink-0";
        
        if (currentShape === 'rhombus') {
            const pts = getShapeVertices(currentShape, 250, 110, valA, valB);
            multCard.innerHTML = `
                ( <span class="px-1.5 py-0.5 rounded text-white" style="background-color: ${pts[0].col}">${valA}m</span> )
                × 4 = ${valA * 4}m
            `;
        } else {
            const pts = getShapeVertices(currentShape, 250, 110, valA, valB);
            const col1 = pts[0].col; // 가로 (상) 또는 한 변
            const col2 = pts[1].col; // 세로 (우) 또는 이웃한 변
            const val1 = pts[0].len;
            const val2 = pts[1].len;
            const total = (val1 + val2) * 2;

            multCard.innerHTML = `
                ( <span class="px-1.5 py-0.5 rounded text-white mx-0.5" style="background-color: ${col1}">${val1}m</span> + 
                <span class="px-1.5 py-0.5 rounded text-white mx-0.5" style="background-color: ${col2}">${val2}m</span> ) × 2 = ${total}m
            `;
        }

        bottomLine.appendChild(multCard);
        formulaDisplay.appendChild(bottomLine);
    }

    function validateGeneralFormula() {
        const input1 = document.getElementById('general-input-1')?.value.trim().replace(/\s+/g, '') || '';
        const input2 = document.getElementById('general-input-2')?.value.trim().replace(/\s+/g, '') || '';
        const inputNum = document.getElementById('general-input-num')?.value.trim() || '';

        const config = shapeConfig[currentShape];

        let isCorrect = false;
        if (currentShape === 'rhombus') {
            if (config.correct1.includes(input1) && inputNum === config.correctNum) {
                isCorrect = true;
            }
        } else {
            if (((config.correct1.includes(input1) && config.correct2.includes(input2)) ||
                 (config.correct1.includes(input2) && config.correct2.includes(input1))) && 
                inputNum === config.correctNum) {
                isCorrect = true;
            }
        }

        if (isCorrect) {
            playSuccessSound();
            showModal("방법 정리하기 성공! 📐", `완벽해요! 🎉\n${config.name}의 둘레 구하는 공식을 올바르게 정리하였습니다.`, "🎉");
            addScore(20);
        } else {
            if (currentShape === 'rhombus') {
                showModal("다시 한번 확인해보세요!", `💡 힌트: 한 변의 길이를 몇 배 해야 할까요?`, "💡");
            } else {
                showModal("다시 한번 확인해보세요!", `💡 힌트: 한 변과 이웃하는 변 더한 후, 몇 배 해야 할까요?`, "💡");
            }
        }
    }

    function validateQuiz() {
        const inA = parseInt(document.getElementById('quiz-in-a')?.value);
        const inB = parseInt(document.getElementById('quiz-in-b')?.value);
        const inAns = parseInt(document.getElementById('quiz-in-ans')?.value);

        let isCorrect = false;
        let correctAns = 0;

        if (currentShape === 'rhombus') {
            correctAns = valA * 4;
            if (inA === valA && inAns === correctAns) isCorrect = true;
        } else {
            correctAns = (valA + valB) * 2;
            if (((inA === valA && inB === valB) || (inA === valB && inB === valA)) && inAns === correctAns) {
                isCorrect = true;
            }
        }

        if (isCorrect) {
            playSuccessSound();
            showModal("대단해요! 정확한 방법입니다.", `식을 올바르게 완성했습니다!\n둘레는 ${correctAns}m가 됩니다.`, "🎯");
            addScore(20);
            spawnConfetti();
        } else {
            showModal("다시 계산해보세요!", "💡 힌트: 변의 길이를 확인하세요. 계산이 맞는지 점검하세요.", "❌");
        }
    }

    function showModal(title, msg, icon) {
        const modal = document.getElementById('custom-modal');
        const modalContent = modal.querySelector('div');
        document.getElementById('modal-title').innerText = title;
        document.getElementById('modal-message').innerText = msg;
        document.getElementById('modal-icon').innerText = icon;

        modal.classList.remove('opacity-0', 'pointer-events-none');
        modalContent.classList.remove('scale-95');
        modalContent.classList.add('scale-100');
    }

    function closeModal() {
        const modal = document.getElementById('custom-modal');
        const modalContent = modal.querySelector('div');

        modal.classList.add('opacity-0', 'pointer-events-none');
        modalContent.classList.remove('scale-100');
        modalContent.classList.add('scale-95');
    }

    function addScore(pts) {
        score = Math.min(100, score + pts);
        document.getElementById('score-val').innerText = score;
    }

    function playSuccessSound() {
        try {
            const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            const notes = [261.63, 329.63, 392.00, 523.25];
            notes.forEach((freq, index) => {
                setTimeout(() => {
                    const osc = audioCtx.createOscillator();
                    const gain = audioCtx.createGain();

                    osc.type = 'triangle';
                    osc.frequency.setValueAtTime(freq, audioCtx.currentTime);

                    gain.gain.setValueAtTime(0.12, audioCtx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.3);

                    osc.connect(gain);
                    gain.connect(audioCtx.destination);

                    osc.start();
                    osc.stop(audioCtx.currentTime + 0.35);
                }, index * 100);
            });
        } catch (e) {}
    }

    function spawnConfetti() {
        const container = document.getElementById('confetti-container');
        container.innerHTML = '';
        const colors = ['#ff4d4f', '#1890ff', '#52c41a', '#fa8c16', '#722ed1', '#eb2f96'];

        for (let i = 0; i < 50; i++) {
            const conf = document.createElement('div');
            const size = Math.random() * 6 + 4;
            conf.style.position = 'absolute';
            conf.style.width = `${size}px`;
            conf.style.height = `${size}px`;
            conf.style.backgroundColor = colors[Math.floor(Math.random() * colors.length)];
            conf.style.borderRadius = '50%';
            conf.style.left = `${Math.random() * 100}%`;
            conf.style.top = `-10px`;

            const duration = Math.random() * 2 + 1;
            conf.style.transition = `transform ${duration}s ease-out, opacity ${duration}s ease-out`;
            conf.style.opacity = '1';

            container.appendChild(conf);

            setTimeout(() => {
                const destX = (Math.random() - 0.5) * 200;
                const destY = window.innerHeight;
                conf.style.transform = `translate(${destX}px, ${destY}px)`;
                conf.style.opacity = '0';
            }, 50);
        }
    }
</script>
