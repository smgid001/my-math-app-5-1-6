<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>정다각형의 둘레를 구해 볼까요</title>
    <!-- Tailwind CSS 제공 -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Nanum+Pen+Script&family=Noto+Sans+KR:wght@300;400;700;900&display=swap');
        body {
            font-family: 'Noto Sans KR', sans-serif;
            background-color: #f4faf0;
        }

        .font-handwriting {
            font-family: 'Nanum Pen Script', cursive;
        }

        /* 숲속 배경 그라데이션 및 디테일 */
        .sky-bg {
            background: linear-gradient(180deg, #bae6fd 0%, #e0f2fe 100%);
        }

        /* 입체감 있는 포스트(기둥) 스타일 */
        .post-shadow {
            filter: drop-shadow(0px 4px 2px rgba(0, 0, 0, 0.15));
        }

        /* 캐릭터 점프 애니메이션 */
        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-8px); }
        }
        .character-bounce {
            animation: bounce 2s infinite ease-in-out;
        }

        /* 꽃밭 바람 효과 */
        @keyframes sway {
            0%, 100% { transform: rotate(0deg); }
            50% { transform: rotate(3deg); }
        }
        .flower-sway {
            animation: sway 3s infinite ease-in-out;
            transform-origin: bottom center;
        }
    </style>
</head>

<body class="min-h-screen flex flex-col items-center justify-center p-4 md:p-6 select-none">
<!-- 메인 컨테이너 (스마트 기기 표준 16:10 고정 비율) -->
<div class="w-full max-w-5xl bg-white rounded-3xl shadow-2xl border-4 border-[#82ca5e] overflow-hidden flex flex-col" style="aspect-ratio: 16 / 10;">

    <!-- 상단 헤더 영역 -->
    <div class="bg-[#82ca5e] px-6 py-4 text-white flex justify-between items-center shrink-0">
        <div>
            <span class="bg-[#5ea739] text-xs font-bold px-3 py-1.5 rounded-full uppercase tracking-wider">초등 5학년 1학기</span>
            <h1 class="text-2xl md:text-3xl font-extrabold mt-1 flex items-center gap-2">
                <span>📐</span> 정다각형의 둘레를 구해 볼까요
            </h1>
        </div>
    </div>

    <!-- 메인 인터랙티브 작업 공간 -->
    <div class="flex-1 grid grid-cols-12 gap-5 p-5 min-h-0 overflow-hidden">

        <!-- 왼쪽: 시뮬레이션, 수식, 배운 내용 정리 -->
        <div class="col-span-6 flex flex-col gap-3 h-full min-h-0">

            <!-- 시뮬레이션 박스 -->
            <div class="flex-1 min-h-0 w-full rounded-2xl overflow-hidden shadow-inner border-2 border-slate-200 sky-bg relative">

                <!-- 배경 장식 (구름, 산, 나무) -->
                <div class="absolute inset-0 pointer-events-none">
                    <div class="absolute top-8 left-10 w-16 h-8 bg-white opacity-80 rounded-full filter blur-[1px]"></div>
                    <div class="absolute top-14 right-16 w-24 h-10 bg-white opacity-80 rounded-full filter blur-[1px]"></div>
                    <svg class="absolute bottom-1/3 left-0 w-full h-1/4 text-[#bae3aa] fill-current" viewBox="0 0 100 20" preserveAspectRatio="none">
                        <path d="M0,20 Q25,5 50,15 T100,10 L100,20 Z" />
                    </svg>
                    <svg class="absolute bottom-1/3 left-0 w-full h-1/5 text-[#a3d991] fill-current opacity-80" viewBox="0 0 100 20" preserveAspectRatio="none">
                        <path d="M0,20 Q30,8 65,16 T100,12 L100,20 Z" />
                    </svg>
                    <div class="absolute bottom-0 w-full h-[45%] bg-[#b0e89d]"></div>
                    <div class="absolute bottom-6 right-8 flex gap-2 text-2xl opacity-90 flower-sway">
                        <span>🌸</span><span>🌼</span><span>🌸</span>
                    </div>
                    <div class="absolute bottom-[41%] right-12 flex gap-3 z-10">
                        <svg class="w-8 h-12" viewBox="0 0 40 60">
                            <rect x="17" y="35" width="6" height="25" fill="#8c6239" />
                            <polygon points="20,5 5,35 35,35" fill="#39b54a" />
                            <polygon points="20,0 10,25 30,25" fill="#22b14c" />
                        </svg>
                        <svg class="w-10 h-14 -mt-2" viewBox="0 0 40 60">
                            <rect x="17" y="35" width="6" height="25" fill="#8c6239" />
                            <polygon points="20,5 5,35 35,35" fill="#1b9c3e" />
                            <polygon points="20,0 8,25 32,25" fill="#0f8030" />
                        </svg>
                    </div>
                </div>

                <!-- 중앙: 다각형 부지 & 줄 두르기 레이어 -->
                <div class="absolute inset-0 z-20 flex items-center justify-center">
                    <svg id="simulation-svg" class="w-full h-full" viewBox="0 0 500 300">
                        <polygon id="soil-polygon" points="" fill="#ebd6b8" stroke="#d5bfa1" stroke-width="4" filter="drop-shadow(0px 8px 8px rgba(0,0,0,0.06))" />
                        <g id="ropes-group"></g>
                        <g id="posts-group"></g>
                        <g id="texts-group"></g>
                    </svg>
                </div>

                <!-- 캐릭터 레이어 (윤수) -->
                <div class="absolute bottom-4 left-10 z-30 flex flex-col items-center">
                    <div class="w-12 h-20 character-bounce relative">
                        <svg class="w-full h-full" viewBox="0 0 60 110">
                            <rect x="15" y="10" width="30" height="30" rx="8" fill="#fddcb4" />
                            <rect x="15" y="8" width="30" height="12" fill="#8c5a3c" rx="4" />
                            <circle cx="23" cy="22" r="2.5" fill="#333" />
                            <circle cx="37" cy="22" r="2.5" fill="#333" />
                            <path d="M 27 28 Q 30 31 33 28" stroke="#ff5c5c" stroke-width="2.5" fill="none" stroke-linecap="round" />
                            <rect x="26" y="39" width="8" height="6" fill="#fddcb4" />
                            <rect x="12" y="44" width="36" height="36" rx="6" fill="#ef4444" />
                            <rect x="18" y="44" width="24" height="6" fill="#ffffff" />
                            <path d="M 12 48 Q 2 60 12 70" stroke="#ef4444" stroke-width="8" fill="none" stroke-linecap="round" />
                            <path d="M 48 48 Q 58 60 48 70" stroke="#ef4444" stroke-width="8" fill="none" stroke-linecap="round" />
                            <circle cx="11" cy="72" r="5" fill="#fddcb4" />
                            <circle cx="49" cy="72" r="5" fill="#fddcb4" />
                            <rect x="15" y="80" width="13" height="22" fill="#3b82f6" />
                            <rect x="32" y="80" width="13" height="22" fill="#3b82f6" />
                            <rect x="13" y="100" width="16" height="8" rx="3" fill="#e2e8f0" />
                            <rect x="31" y="100" width="16" height="8" rx="3" fill="#e2e8f0" />
                        </svg>
                    </div>

                    <div class="relative -mt-4 z-40">
                        <div id="rope-coil" class="w-10 h-8 bg-[#ad7c59] rounded-full border-4 border-[#8c5d3d] flex flex-col justify-between p-1 shadow-md transition-all duration-500">
                            <div class="h-0.5 bg-[#ecd5b5] rounded opacity-75"></div>
                            <div class="h-0.5 bg-[#ecd5b5] rounded opacity-75"></div>
                        </div>
                        <span class="absolute -top-2 -right-2 text-[10px] bg-amber-800 text-white font-bold px-1 rounded-full scale-90">밧줄</span>
                    </div>
                </div>

                <!-- 상황 말풍선 -->
                <div class="absolute bottom-[116px] left-[8px] z-40 bg-white/95 px-3 py-2 rounded-2xl shadow-lg border-2 border-[#82ca5e] text-xs font-bold text-slate-700 w-[155px] text-justify break-all">
                    <div class="absolute bottom-[-6px] left-6 w-3 h-3 bg-white border-b-2 border-r-2 border-[#82ca5e] rotate-45"></div>
                    <span id="char-speech">정사각형 모양 캠핑장에 단단한 울타리를 쳐볼까요?</span>
                </div>

            </div>

            <!-- 실시간 수식 매칭 카드 -->
            <div class="bg-slate-50 border-2 border-dashed border-slate-200 rounded-2xl px-4 py-2 flex flex-col justify-center items-center h-[75px] shrink-0">
                <p class="text-xs text-slate-500 font-bold mb-1 uppercase tracking-wider">정다각형 울타리에 두른 밧줄의 길이는?</p>
                <div id="formula-display" class="text-xl md:text-2xl font-extrabold flex flex-wrap items-center justify-center gap-1.5">
                    <span class="text-slate-400 font-normal text-xs md:text-sm">줄 두르기 버튼을 눌러보세요!</span>
                </div>
            </div>

            <!-- 정다각형 둘레 구하는 방법 정리하기 -->
            <div class="bg-white border-2 border-[#82ca5e] rounded-2xl px-3.5 py-2.5 flex flex-col gap-1.5 shadow-sm shrink-0">
                <p class="text-xs text-[#4c8a2b] font-bold uppercase tracking-wider flex items-center gap-1.5">
                    <span>💡</span> 정다각형의 둘레를 구하는 방법을 정리해봅시다.
                </p>
                <div class="flex flex-wrap items-center gap-1.5 text-xs md:text-sm font-extrabold text-slate-700 bg-[#f7fdf5] p-1.5 rounded-xl border border-[#c2e7b0] justify-center">
                    <div class="bg-[#82ca5e]/15 text-[#4c8a2b] px-2 py-1 rounded-md text-xs">정다각형의 둘레</div>
                    <span class="text-slate-500 text-xs">=</span>
                    <input type="text" id="general-input-1" class="w-28 h-9 border-2 border-slate-300 rounded-lg text-center text-xs md:text-sm font-bold placeholder-slate-300/60 focus:outline-none focus:ring-2 focus:ring-[#82ca5e]" placeholder="한 변의 길이">
                    <span class="text-slate-400 text-xs">×</span>
                    <input type="text" id="general-input-2" class="w-20 h-9 border-2 border-slate-300 rounded-lg text-center text-xs md:text-sm font-bold placeholder-slate-300/60 focus:outline-none focus:ring-2 focus:ring-[#82ca5e]" placeholder="변의 수">

                    <button onclick="validateGeneralFormula()" class="ml-1 bg-[#82ca5e] hover:bg-[#5ea739] text-white text-xs px-2.5 py-1.5 rounded-lg transition-colors shadow-sm flex items-center gap-1">
                        <span>✔</span> 확인
                    </button>
                </div>
            </div>

        </div>

        <!-- 오른쪽: 설정 및 퀴즈 미션 -->
        <div class="col-span-6 flex flex-col gap-3 h-full min-h-0">

            <!-- 설정 구역 -->
            <div class="bg-[#f0f9eb] border-2 border-[#c2e7b0] rounded-2xl p-3.5 flex flex-col gap-2 flex-1 min-h-0 justify-center">
                <h3 class="font-bold text-[#4c8a2b] flex items-center gap-1.5 border-b border-[#c2e7b0] pb-1 text-xs md:text-sm shrink-0">
                    <span>⚙️</span> 캠핑장 설계하기 (설정)
                </h3>

                <!-- 1. 다각형 종류 선택 -->
                <div class="flex-1 flex flex-col justify-center min-h-0">
                    <label class="block text-xs font-bold text-slate-600 mb-1">울타리 모양 (정다각형)</label>
                    <div class="grid grid-cols-4 gap-1.5">
                        <button onclick="changePolygon(3)" id="btn-poly-3" class="poly-btn px-1 py-1.5 rounded-xl text-xs font-bold border-2 bg-white text-slate-600 border-slate-200 hover:border-slate-300">정삼각형</button>
                        <button onclick="changePolygon(4)" id="btn-poly-4" class="poly-btn px-1 py-1.5 rounded-xl text-xs font-bold border-2 bg-[#82ca5e] text-white border-[#82ca5e]">정사각형</button>
                        <button onclick="changePolygon(5)" id="btn-poly-5" class="poly-btn px-1 py-1.5 rounded-xl text-xs font-bold border-2 bg-white text-slate-600 border-slate-200 hover:border-slate-300">정오각형</button>
                        <button onclick="changePolygon(6)" id="btn-poly-6" class="poly-btn px-1 py-1.5 rounded-xl text-xs font-bold border-2 bg-white text-slate-600 border-slate-200 hover:border-slate-300">정육각형</button>
                    </div>
                </div>

                <!-- 2. 한 변의 길이 조정 (슬라이더) -->
                <div class="flex-1 flex flex-col justify-center min-h-0">
                    <div class="flex justify-between items-center mb-0.5">
                        <label class="text-xs font-bold text-slate-600">한 변의 길이 설정</label>
                        <span class="text-xs md:text-sm font-black text-amber-600 bg-amber-100 px-2 py-0.5 rounded-full"><span id="side-length-val">6</span>m</span>
                    </div>
                    <input type="range" id="side-length-slider" min="3" max="10" value="6" oninput="updateSideLength(this.value)" class="w-full h-1.5 bg-slate-200 rounded-lg appearance-none cursor-pointer accent-[#82ca5e]">
                    <div class="flex justify-between text-[10px] text-slate-500 px-0.5 mt-0.5 font-bold">
                        <span>3m</span>
                        <span>5m</span>
                        <span>7m</span>
                        <span>10m</span>
                    </div>
                </div>

                <!-- 액션 버튼 -->
                <button onclick="startRopeAnimation()" id="play-btn" class="w-full bg-[#fa8c16] hover:bg-[#e07b10] text-white font-black text-xs md:text-sm py-2 px-3 rounded-xl shadow-md transition-colors flex items-center justify-center gap-1.5 shrink-0">
                    <span>🧵</span> 울타리에 줄 두르기
                </button>
            </div>

            <!-- 퀴즈 구역 -->
            <div class="bg-white border-2 border-slate-100 rounded-2xl p-3.5 shadow-sm flex flex-col gap-2 flex-1 min-h-0 justify-center">
                <div class="flex justify-between items-center border-b border-slate-100 pb-1 shrink-0">
                    <h3 class="font-bold text-slate-800 flex items-center gap-1.5 text-xs md:text-sm">
                        <span>📝</span> 둘레 구하기 미션
                    </h3>
                    <span class="bg-amber-100 text-amber-800 text-xs font-bold px-2 py-0.5 rounded">미션 20점</span>
                </div>

                <div class="bg-slate-50 p-2 rounded-xl shrink-0">
                    <p class="text-xs md:text-sm leading-relaxed text-slate-700 text-justify break-all">
                        윤수가 만든 <span id="quiz-poly-name" class="font-extrabold text-[#4c8a2b]">정사각형</span> 울타리의 둘레를 구해봅시다.
                    </p>
                </div>

                <!-- 수식 입력 공간 -->
                <div class="flex-1 flex flex-col justify-center min-h-0">
                    <div class="flex items-center gap-2 text-xs md:text-sm font-extrabold justify-center bg-slate-50 p-2.5 rounded-xl border border-slate-200">

                        <!-- 한 변의 길이 -->
                        <div class="flex flex-col items-center gap-0.5">
                            <div class="bg-amber-50 text-amber-800 w-24 h-8 flex items-center justify-center rounded-lg border border-amber-200 text-xs md:text-sm font-black shrink-0 text-center">
                                <span id="quiz-side-val">6</span>m
                            </div>
                            <span class="text-[10px] text-slate-500 font-bold">한 변의 길이</span>
                        </div>

                        <span class="text-slate-400 text-xs md:text-sm">×</span>

                        <!-- 변의 수 (입력창) -->
                        <div class="flex flex-col items-center gap-0.5">
                            <input type="number" id="input-sides" class="w-12 h-8 border-2 border-orange-400 rounded-lg text-center font-black text-xs md:text-sm focus:outline-none focus:ring-2 focus:ring-orange-500" placeholder="?">
                            <span class="text-[10px] text-slate-500 font-bold">변의 수</span>
                        </div>

                        <span class="text-slate-400 text-xs md:text-sm">=</span>

                        <!-- 정다각형의 둘레 (입력창) -->
                        <div class="flex flex-col items-center gap-0.5">
                            <div class="relative">
                                <input type="number" id="input-perimeter" class="w-20 h-8 border-2 border-orange-400 rounded-lg text-center font-black text-xs md:text-sm focus:outline-none focus:ring-2 focus:ring-orange-500 pr-3" placeholder="?">
                                <span class="absolute right-1 top-2 text-[10px] text-slate-400">m</span>
                            </div>
                            <span class="text-[10px] text-slate-500 font-bold">정다각형의 둘레</span>
                        </div>

                    </div>
                </div>

                <!-- 정답 제출 버튼 -->
                <button onclick="validateQuiz()" class="w-full bg-[#1890ff] hover:bg-[#096dd9] text-white font-bold py-2 px-3 rounded-xl shadow-md transition-colors text-xs md:text-sm flex items-center justify-center gap-1.5 shrink-0">
                    <span>🔍</span> 정답 제출 및 확인
                </button>
            </div>

            <!-- 스코어 판 -->
            <div class="flex justify-between items-center px-4 py-2 bg-slate-100 rounded-xl shrink-0 h-[38px]">
                <span class="text-slate-600 font-bold text-xs md:text-sm">🏅 나의 수학 탐구 점수</span>
                <span class="text-xs md:text-sm font-extrabold text-[#4c8a2b]"><span id="score-val">0</span>점 / 100점</span>
            </div>

        </div>

    </div>

</div>

<!-- 맞췄을 때 성공 컨페티 레이어 -->
<div id="confetti-container" class="fixed inset-0 pointer-events-none z-50 overflow-hidden"></div>

<!-- 커스텀 알림 모달 -->
<div id="custom-modal" class="fixed inset-0 bg-black/50 z-50 flex items-center justify-center opacity-0 pointer-events-none transition-opacity duration-300">
    <div class="bg-white rounded-3xl p-6 max-w-sm w-full mx-4 shadow-2xl border-4 border-[#82ca5e] transform scale-95 transition-transform duration-300 text-center">
        <div id="modal-icon" class="text-4xl mb-2">💡</div>
        <h3 id="modal-title" class="text-xl font-black text-slate-800 mb-2">알림</h3>
        <p id="modal-message" class="text-sm text-slate-600 leading-relaxed mb-6 whitespace-pre-line"></p>
        <button onclick="closeModal()" class="w-full bg-[#82ca5e] hover:bg-[#5ea739] text-white font-black py-3 rounded-xl shadow-md transition-colors">확인</button>
    </div>
</div>

<script>
    let polySides = 4;        // 현재 선택된 다각형 변의 수
    let sideLength = 6;       // 한 변의 실제 수학적 길이
    let isDrawing = false;    // 애니메이션 진행 상태
    let score = 0;            // 학습 누적 점수

    const colorPalette = ['#ff4d4f', '#1890ff', '#52c41a', '#fa8c16', '#722ed1', '#eb2f96'];
    const polyNames = { 3: "정삼각형", 4: "정사각형", 5: "정오각형", 6: "정육각형" };
    const SVG_NS = "http://www.w3.org/2000/svg";

    function showNotification(message, title = "알림", icon = "💡") {
        const modal = document.getElementById('custom-modal');
        const modalContent = modal.querySelector('div');
        document.getElementById('modal-title').innerText = title;
        document.getElementById('modal-message').innerText = message;
        document.getElementById('modal-icon').innerText = icon;

        modal.classList.remove('opacity-0', 'pointer-events-none');
        modalContent.classList.remove('scale-95');
        modalContent.classList.add('scale-100');
    }

    function closeModal() {
        const modal = document.getElementById('custom-modal');
        const modalContent = modal.querySelector('div');

        modal.classList.add('opacity-0', 'pointer-events-none');
        modalContent.classList.remove('scale-100');
        modalContent.classList.add('scale-95');
    }

    window.onload = function() {
        renderScene();
    }

    function changePolygon(sides) {
        if (isDrawing) return;
        polySides = sides;

        document.querySelectorAll('.poly-btn').forEach(btn => {
            btn.className = "poly-btn px-1 py-1.5 rounded-xl text-xs font-bold border-2 bg-white text-slate-600 border-slate-200 hover:border-slate-300";
        });
        const activeBtn = document.getElementById(`btn-poly-${sides}`);
        if (activeBtn) {
            activeBtn.className = "poly-btn px-1 py-1.5 rounded-xl text-xs font-bold border-2 bg-[#82ca5e] text-white border-[#82ca5e]";
        }

        document.getElementById('quiz-poly-name').innerText = polyNames[sides];
        document.getElementById('quiz-side-val').innerText = sideLength;

        clearQuizFields();
        document.getElementById('char-speech').innerText = `멋진 ${polyNames[sides]} 캠핑 부지야! 한 변의 길이는 ${sideLength}m로 정했어.`;

        renderScene();
    }

    function updateSideLength(val) {
        if (isDrawing) return;
        sideLength = parseInt(val);
        document.getElementById('side-length-val').innerText = sideLength;
        document.getElementById('quiz-side-val').innerText = sideLength;

        clearQuizFields();
        document.getElementById('char-speech').innerText = `한 변의 길이를 ${sideLength}m로 변경했어. 줄을 둘러보자!`;
        renderScene();
    }

    function clearQuizFields() {
        document.getElementById('input-sides').value = '';
        document.getElementById('input-perimeter').value = '';
        document.getElementById('formula-display').innerHTML = '<span class="text-slate-400 font-normal text-xs md:text-sm">줄 두르기 버튼을 눌러보세요!</span>';

        const coil = document.getElementById('rope-coil');
        coil.style.transform = 'scale(1)';
    }

    function getPolygonVertices(sides, centerX, centerY, radius) {
        const rawVertices = [];
        let startAngle = -Math.PI / 2;

        if (sides === 3) startAngle = -Math.PI / 2;
        else if (sides === 4) startAngle = Math.PI / 4;
        else if (sides === 5) startAngle = -Math.PI / 2;
        else if (sides === 6) startAngle = 0;

        for (let i = 0; i < sides; i++) {
            const angle = startAngle + (i * 2 * Math.PI / sides);
            const x = centerX + radius * Math.cos(angle);
            const y = centerY + radius * Math.sin(angle);
            rawVertices.push({ x, y });
        }

        let topIdx = 0;
        for (let i = 1; i < rawVertices.length; i++) {
            const current = rawVertices[i];
            const best = rawVertices[topIdx];
            const yDiff = current.y - best.y;

            if (yDiff < -0.01) {
                topIdx = i;
            } else if (Math.abs(yDiff) <= 0.01) {
                if (current.x < best.x) {
                    topIdx = i;
                }
            }
        }

        const sortedVertices = [];
        for (let i = 0; i < sides; i++) {
            sortedVertices.push(rawVertices[(topIdx - i + sides) % sides]);
        }
        return sortedVertices;
    }

    function renderScene() {
        const centerX = 290;
        const centerY = 145;
        const radius = 35 + sideLength * 6.5;

        const vertices = getPolygonVertices(polySides, centerX, centerY, radius);

        const soilPointsStr = vertices.map(v => `${v.x},${v.y}`).join(' ');
        document.getElementById('soil-polygon').setAttribute('points', soilPointsStr);

        const postsGroup = document.getElementById('posts-group');
        postsGroup.innerHTML = '';

        vertices.forEach((v) => {
            const g = document.createElementNS(SVG_NS, "g");
            g.setAttribute('class', 'post-shadow');

            const rect = document.createElementNS(SVG_NS, "rect");
            rect.setAttribute('x', v.x - 5);
            rect.setAttribute('y', v.y - 20);
            rect.setAttribute('width', 10);
            rect.setAttribute('height', 24);
            rect.setAttribute('rx', 2.5);
            rect.setAttribute('fill', '#9c724b');
            rect.setAttribute('stroke', '#6e4c2f');
            rect.setAttribute('stroke-width', '1.2');

            const ellipse = document.createElementNS(SVG_NS, "ellipse");
            ellipse.setAttribute('cx', v.x);
            ellipse.setAttribute('cy', v.y - 20);
            ellipse.setAttribute('rx', 5);
            ellipse.setAttribute('ry', 3);
            ellipse.setAttribute('fill', '#c69c72');
            ellipse.setAttribute('stroke', '#6e4c2f');
            ellipse.setAttribute('stroke-width', '0.8');

            g.appendChild(rect);
            g.appendChild(ellipse);
            postsGroup.appendChild(g);
        });

        document.getElementById('ropes-group').innerHTML = '';

        const textsGroup = document.getElementById('texts-group');
        textsGroup.innerHTML = '';

        for (let i = 0; i < polySides; i++) {
            const startPt = vertices[i];
            const endPt = vertices[(i + 1) % polySides];

            const midX = (startPt.x + endPt.x) / 2;
            const midY = ((startPt.y - 8) + (endPt.y - 8)) / 2;

            const dx = midX - centerX;
            const dy = midY - (centerY - 8);
            const dist = Math.sqrt(dx * dx + dy * dy) || 1;

            const offset = 24;
            const textX = midX + (dx / dist) * offset;
            const textY = midY + (dy / dist) * offset;

            const text = document.createElementNS(SVG_NS, "text");
            text.setAttribute('x', textX);
            text.setAttribute('y', textY + 4);
            text.setAttribute('fill', '#b45309');
            text.setAttribute('font-weight', '900');
            text.setAttribute('font-size', '13px');
            text.setAttribute('text-anchor', 'middle');
            text.setAttribute('stroke', '#ffffff');
            text.setAttribute('stroke-width', '2.5');
            text.setAttribute('paint-order', 'stroke fill');

            text.textContent = `${sideLength}m`;

            textsGroup.appendChild(text);
        }
    }

    function startRopeAnimation() {
        if (isDrawing) return;
        isDrawing = true;

        const formulaDisplay = document.getElementById('formula-display');
        formulaDisplay.innerHTML = '';

        const coil = document.getElementById('rope-coil');
        coil.style.transform = 'scale(0.7)';

        const centerX = 290;
        const centerY = 145;
        const radius = 35 + sideLength * 6.5;

        const vertices = getPolygonVertices(polySides, centerX, centerY, radius);
        const ropesGroup = document.getElementById('ropes-group');
        ropesGroup.innerHTML = '';

        let currentEdge = 0;

        function drawNextRope() {
            if (currentEdge >= polySides) {
                isDrawing = false;
                document.getElementById('char-speech').innerText = `우와! 밧줄을 모두 둘렀어. 한 변의 길이 ${sideLength}m가 총 ${polySides}번 반복되었네!`;
                appendMultiplicationFormula();
                return;
            }

            const startPt = vertices[currentEdge];
            const endPt = vertices[(currentEdge + 1) % polySides];

            const line = document.createElementNS(SVG_NS, "line");
            line.setAttribute('x1', startPt.x);
            line.setAttribute('y1', startPt.y - 8);
            line.setAttribute('x2', startPt.x);
            line.setAttribute('y2', startPt.y - 8);

            const edgeColor = colorPalette[currentEdge % colorPalette.length];
            line.setAttribute('stroke', edgeColor);
            line.setAttribute('stroke-width', '4.5');
            line.setAttribute('stroke-linecap', 'round');
            line.setAttribute('stroke-dasharray', '6, 3');

            ropesGroup.appendChild(line);

            document.getElementById('char-speech').innerText = `${currentEdge + 1}번째 변에 줄을 치고 있어! (길이: ${sideLength}m)`;

            appendAdditionCard(currentEdge, edgeColor);

            let startTimestamp = null;
            const duration = 1000;

            function animateSegment(timestamp) {
                if (!startTimestamp) startTimestamp = timestamp;
                const progress = Math.min((timestamp - startTimestamp) / duration, 1);

                const currX = startPt.x + (endPt.x - startPt.x) * progress;
                const currY = (startPt.y - 8) + (endPt.y - startPt.y) * progress;

                line.setAttribute('x2', currX);
                line.setAttribute('y2', currY);

                if (progress < 1) {
                    requestAnimationFrame(animateSegment);
                } else {
                    currentEdge++;
                    drawNextRope();
                }
            }

            requestAnimationFrame(animateSegment);
        }

        drawNextRope();
    }

    function appendAdditionCard(index, color) {
        const formulaDisplay = document.getElementById('formula-display');

        if (index > 0) {
            const plusSign = document.createElement('span');
            plusSign.className = "text-slate-400 mx-1 text-xs md:text-sm";
            plusSign.innerText = "+";
            formulaDisplay.appendChild(plusSign);
        }

        const card = document.createElement('div');
        card.style.backgroundColor = color;
        card.className = `text-white px-2 py-0.5 md:py-1 rounded-lg font-black shadow-md flex flex-col items-center transform scale-0 transition-transform duration-300 shrink-0`;
        card.innerHTML = `
            <span class="text-[9px] opacity-85 leading-none mb-0.5">${index + 1}번 변</span>
            <span class="text-xs md:text-sm leading-none">${sideLength}m</span>
        `;

        formulaDisplay.appendChild(card);

        setTimeout(() => {
            card.classList.remove('scale-0');
            card.classList.add('scale-100');
        }, 50);
    }

    function appendMultiplicationFormula() {
        const formulaDisplay = document.getElementById('formula-display');

        const equalsSign = document.createElement('span');
        equalsSign.className = "text-slate-500 font-black mx-1 text-sm md:text-base";
        equalsSign.innerText = "=";
        formulaDisplay.appendChild(equalsSign);

        const multCard = document.createElement('div');
        multCard.className = "bg-amber-500 text-white px-2.5 py-0.5 md:py-1 rounded-xl font-black shadow-md border-2 border-amber-300 text-center flex flex-col justify-center items-center shrink-0";
        multCard.innerHTML = `
            <span class="text-[9px] text-amber-100 font-bold uppercase leading-none mb-0.5">곱셈식으로 나타내기</span>
            <span class="text-xs md:text-sm leading-none">${sideLength}m × ${polySides} = ${sideLength * polySides}m</span>
        `;
        formulaDisplay.appendChild(multCard);
    }

    function validateGeneralFormula() {
        const val1 = document.getElementById('general-input-1').value.trim().replace(/\s+/g, '');
        const val2 = document.getElementById('general-input-2').value.trim().replace(/\s+/g, '');

        const correct1 = "한변의길이";
        const correct2 = ["변의수", "변의개수", "꼭짓점의수", "꼭짓점수"];

        if (val1 === "" || val2 === "") {
            showNotification("정리하기 빈칸을 모두 채워보세요! 💡", "정리해 볼까요?", "✍️");
            return;
        }

        const isCorrect1 = (val1 === correct1);
        const isCorrect2 = correct2.includes(val2);

        if (isCorrect1 && isCorrect2) {
            playSuccessSound();
            showNotification(`완벽해요! 🎉\n정다각형은 모든 변의 길이가 같기 때문에,\n\n(정다각형의 둘레) = (한 변의 길이) × (변의 수)\n\n이 방법으로 아주 쉽게 둘레를 구할 수 있답니다!`, "방법 정리하기 성공! 📐", "🎉");

            score += 20;
            if (score > 100) score = 100;
            document.getElementById('score-val').innerText = score;
            spawnConfetti();

            document.getElementById('char-speech').innerText = `정다각형 둘레 구하는 방법을 완벽하게 정리했어! 넌 수학 박사야! 🎓`;
        } else {
            showNotification("앗! 입력한 내용을 다시 확인해 보세요.\n힌트: '한 변의 길이'와 '변의 수'를 순서대로 적어보세요!", "조금만 더 힘내요!", "❌");
        }
    }

    function validateQuiz() {
        const inputSides = parseInt(document.getElementById('input-sides').value);
        const inputPerimeter = parseInt(document.getElementById('input-perimeter').value);

        const correctSides = polySides;
        const correctPerimeter = sideLength * polySides;

        if (isNaN(inputSides) || isNaN(inputPerimeter)) {
            showNotification("빈칸에 알맞은 숫자를 모두 입력해 주세요! 🤔", "확인해 주세요", "✍️");
            return;
        }

        if (inputSides === correctSides && inputPerimeter === correctPerimeter) {
            playSuccessSound();
            showNotification(`한 변의 길이(${sideLength}m)가 정다각형의 변의 수(${polySides}개)만큼 있으므로 둘레는 ${correctPerimeter}m가 됩니다!`, "🎯 대단해요! 정확한 방법입니다.", "🎉");

            score += 20;
            if (score > 100) score = 100;
            document.getElementById('score-val').innerText = score;

            spawnConfetti();
            document.getElementById('char-speech').innerText = `와! 윤수와 친구들 모두 둘레 구하는 멋진 방법을 마스터했어. 최고야! 🥳`;
        } else {
            showNotification("울타리 밧줄의 색상 수(변의 수)와 실시간 수식 카드의 합을 다시 확인해 보세요. 다시 도전할 수 있어요! 💪", "앗! 정답이 아니에요.", "❌");
        }
    }

    function playSuccessSound() {
        try {
            const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            const notes = [261.63, 329.63, 392.00, 523.25];
            notes.forEach((freq, index) => {
                setTimeout(() => {
                    const osc = audioCtx.createOscillator();
                    const gain = audioCtx.createGain();

                    osc.type = 'triangle';
                    osc.frequency.setValueAtTime(freq, audioCtx.currentTime);

                    gain.gain.setValueAtTime(0.15, audioCtx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.3);

                    osc.connect(gain);
                    gain.connect(audioCtx.destination);

                    osc.start();
                    osc.stop(audioCtx.currentTime + 0.35);
                }, index * 100);
            });
        } catch (e) {}
    }

    function spawnConfetti() {
        const container = document.getElementById('confetti-container');
        container.innerHTML = '';

        const colors = ['#ff4d4f', '#1890ff', '#52c41a', '#fa8c16', '#722ed1', '#eb2f96', '#fadb14'];

        for (let i = 0; i < 60; i++) {
            const conf = document.createElement('div');
            const size = Math.random() * 6 + 5;
            const color = colors[Math.floor(Math.random() * colors.length)];

            conf.style.position = 'absolute';
            conf.style.width = `${size}px`;
            conf.style.height = `${size}px`;
            conf.style.backgroundColor = color;
            conf.style.borderRadius = '50%';

            conf.style.left = `${Math.random() * 100}%`;
            conf.style.top = `-20px`;

            const duration = Math.random() * 2 + 1.5;
            const delay = Math.random() * 0.5;

            conf.style.transition = `transform ${duration}s ease-out, opacity ${duration}s ease-out`;
            conf.style.transitionDelay = `${delay}s`;
            conf.style.opacity = '1';

            container.appendChild(conf);

            setTimeout(() => {
                const rot = Math.random() * 360;
                const destX = (Math.random() - 0.5) * 300;
                const destY = window.innerHeight + 50;

                conf.style.transform = `translate(${destX}px, ${destY}px) rotate(${rot}deg)`;
                conf.style.opacity = '0';
            }, 100);
        }
    }
